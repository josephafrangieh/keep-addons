name: keep agent
version: "0.1.0"
slug: keep_agent
description: Connects this Home Assistant to keep. It only dials out, so nothing is opened to the internet.
url: https://github.com/josephafrangieh/keep-addons
arch:
  - aarch64
  - amd64
image: ghcr.io/josephafrangieh/keep-agent
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-automation
panel_title: keep
options:
  gateway_url: wss://keep-gateway.fly.dev/agent
  log_level: info
schema:
  gateway_url: match(^wss://.+)
  log_level: list(debug|info|warn|error)
