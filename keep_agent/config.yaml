name: keep agent
version: "0.25.0"
slug: keep_agent
description: Connects this Home Assistant to keep. It only dials out, so nothing is opened to the internet.
url: https://github.com/josephafrangieh/keep-addons
arch:
  - aarch64
  - amd64
image: ghcr.io/josephafrangieh/keep-agent
startup: application
boot: auto
homeassistant_api: true
# Supervisor: the agent only makes, lists and reads backups, and asks it to look for updates
# ("Check for updates" from keep's admin). That last one needs the manager role; the agent's
# code never uses it for anything else (no restores, no installing add-ons, no host control).
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
# Local access for the keep app and wall panels on the home Wi-Fi (signed requests only; see DOCS.md).
ports:
  8125/tcp: 8125
ports_description:
  8125/tcp: keep app and wall panels on the home network (switch off to use the app through the cloud only)
panel_icon: mdi:alpha-k-box
panel_title: keep
options:
  gateway_url: wss://keep-gateway.fly.dev/agent
  log_level: info
  # Keep staff may install Home Assistant's updates (Core, OS, add-ons…) from keep's admin.
  allow_updates: true
  # Keep staff may work in Home Assistant when the home's owner opens a support session from the keep app.
  allow_remote_support: true
schema:
  gateway_url: match(^wss://.+)
  log_level: list(debug|info|warn|error)
  allow_updates: bool
  allow_remote_support: bool
  # Optional: Home Assistant's own address for remote support, when it serves https itself
  # (default http://homeassistant:8123).
  ha_url: url?
  # Optional: go2rtc's address for live video, when it isn't found by itself
  # (Frigate's built-in go2rtc and the go2rtc add-on are found automatically).
  go2rtc_url: url?
  # Optional: Frigate's address for recordings' pictures and clips, when it isn't found by itself.
  frigate_url: url?
